<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2D Multiplayer Arena</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="menu">
        <h1>⚔️ ARENA 2D</h1>

        <p>Enter your name:</p>

        <input
            id="nome"
            type="text"
            maxlength="16"
            placeholder="Your name"
            value="Player"
        >

        <button id="entrar">ENTER ARENA</button>

        <p id="status">Connecting...</p>
    </div>


    <div id="jogo" style="display: none;">

        <div id="topo">

            <div>
                ❤️ Health:
                <span id="vida">100</span>
            </div>

            <div>
                ☠️ Kills:
                <span id="mata">0</span>
            </div>

            <div>
                💀 Deaths:
                <span id="mortes">0</span>
            </div>

            <div id="cara">
                👥 Players:
                <span id="jogadores">0</span>
            </div>

        </div>


        <canvas
            id="arena"
            width="1200"
            height="700">
        </canvas>


        <div id="controles">
            <span>WASD = Move</span>
            <span>Mouse = Aim</span>
            <span>Left Click = Shoot</span>
        </div>


        <div id="mensagens"></div>

    </div>


    <script src="jogo.js"></script>

</body>
</html>
